<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">

  <link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="YOFI">
  
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  
<style>
  body {
    margin: 0;
    padding: 24px 18px;
    background: #0B0B0D;
    color: #F5F1E8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.5;
  }

  h1 {
    color: #D4AF37;
    font-size: 36px;
    letter-spacing: 5px;
    margin-bottom: 4px;
  }

  h3 {
    color: #D4AF37;
  }

  button {
    background: #D4AF37;
    color: #111111;
    border: none;
    border-radius: 12px;
    padding: 15px 20px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    max-width: 100%;
  }

  input {
    background: #19191C;
    color: white;
    border: 1px solid #51462B;
    border-radius: 10px;
    padding: 12px;
    font-size: 16px;
    box-sizing: border-box;
    max-width: 100%;
  }

  #productDetails {
    background: #171719;
    border: 1px solid #393327;
    border-radius: 18px;
    padding: 18px;
    margin-top: 24px;
  }

.scan-button {
  display: block;
  width: 100%;
  padding: 20px;
  margin: 24px 0 16px;
  background: #D4AF37;
  color: #111111;
  border: none;
  border-radius: 16px;
  font-size: 18px;
  font-weight: 700;
  box-shadow: 0 4px 20px rgba(212, 175, 55, 0.15);
}
  
/* YOFI – karta produktu */
#productDetails {
  background: #171719;
  border: 1px solid #3D3525;
  border-radius: 20px;
  padding: 22px 18px;
  margin-top: 24px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
}

#productDetails h3 {
  color: #D4AF37;
  font-size: 19px;
  margin-top: 0;
  margin-bottom: 20px;
}

#productDetails label {
  display: block;
  color: #B5B0A7;
  font-size: 13px;
  margin-bottom: 7px;
}

#productDetails input {
  display: block;
  width: 100%;
  padding: 15px;
  background: #101012;
  border: 1px solid #4A4030;
  border-radius: 12px;
  color: #FFFFFF;
  font-size: 16px;
}

#productDetails input:focus {
  outline: none;
  border-color: #D4AF37;
}

#productDetails p {
  margin: 16px 0;
}



.continue-button {
  display: block;
  width: 100%;
  margin-top: 20px;
  padding: 18px;
  background: #D4AF37;
  color: #111111;
  border: none;
  border-radius: 14px;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
}

/* YOFI – sjednocení s hlavní aplikací */
body {
  background: #111111;
  color: #F2F2F2;
}

h1, h3 {
  color: #D0B579;
}

button {
  background: #D0B579;
  color: #111111;
}

#productDetails {
  background: #202020;
  border: 1px solid #393939;
  box-shadow: none;
}

#productDetails input {
  background: #111111;
  border: 1px solid #555555;
}

.scan-button {
  background: #D0B579;
  box-shadow: none;
}

.continue-button {
  background: transparent;
  color: #D0B579;
  border: 1px solid #8B754A;
}


.yofi-header {
  text-align: center;
  padding: 35px 0 30px;
  margin: -24px -18px 30px;
  border-bottom: 1px solid #8B754A;
}

.yofi-header h1 {
  color: #D0B579;
  font-size: 34px;
  font-weight: 300;
  letter-spacing: 12px;
  margin: 0 0 14px;
}

.yofi-header p {
  color: #A8A8A8;
  font-size: 11px;
  letter-spacing: 5px;
  margin: 0;
}

  
</style>


</head>
<body>

<header class="yofi-header">
  <h1>YOFI</h1>
  <p>SKLAD A STATISTIKY</p>
</header>

 
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js');
    });
  }
</script>
 


<button class="scan-button" onclick="startScanner()">
  ◉ Skenovat EAN
</button>

<div id="reader" style="width:100%;max-width:400px;"></div>
<p id="scanResult">Zatím nic nenaskenováno</p>
  
<div id="productDetails">
  <h3>Informace o produktu</h3>
  
<p>
  <label for="productEAN">EAN produktu:</label>


<input type="text" id="productEAN"
       inputmode="numeric"
       placeholder="Naskenujte nebo zadejte EAN"
       oninput="confirmEAN()">


<button type="button" class="continue-button" onclick="openStockWithEAN()">
  Pokračovat do skladu →
</button>



<script>


function confirmEAN() {
  const ean = document.getElementById("productEAN").value.trim();
  const result = document.getElementById("scanResult");

  if (ean) {
    result.textContent = "EAN připraven: " + ean;
  } else {
    result.textContent = "Zatím nic nenaskenováno";
  }
}


function openStockWithEAN() {
  const ean = document.getElementById("productEAN").value.trim();

  if (!ean) {
    alert("Nejprve zadejte nebo naskenujte EAN.");
    return;
  }

  const url = "https://script.google.com/macros/s/AKfycbwcZlJNvov3Q9myldEbcY5gKATCZPIsnIeyDNxsHRJrmrahykWpXo_NsR-sthmYKXdWwg/exec";

  
window.open(url + "?new=1&ean=" + encodeURIComponent(ean), "_blank");


}

</script>

</p>



</div>



<script>
let scanner = null;

async function startScanner() {
  const result = document.getElementById("scanResult");
  result.textContent = "Spouštím fotoaparát...";

  try {
    if (scanner) {
      await scanner.stop();
      scanner.clear();
    }

    scanner = new Html5Qrcode("reader", {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.CODE_128
      ]
    });

    await scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 150 } },
      async (decodedText) => {
        result.textContent = "Naskenovaný EAN: " + decodedText;
        
document.getElementById("productEAN").value = decodedText;


confirmEAN();

        await scanner.stop();
        scanner.clear();
        scanner = null;
      },
      () => {}
    );
  } catch (error) {
    result.textContent = "Chyba: " + error.message;
  }
}
</script>


</body>
  
</html>
