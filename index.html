<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>YOFI | Sklad</title>
  <link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="YOFI">
</head>
<body>
  <h1>YOFI</h1>
  <p>Mobilní skladová aplikace</p>
 
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js');
    });
  }
</script>
 
<button id="testCamera" onclick="testCamera()">
  Otestovat fotoaparát
</button>

<p id="cameraStatus"></p>
<video id="cameraPreview" autoplay playsinline muted
       style="width:100%;max-width:400px;"></video>

<script>
async function testCamera() {
  const status = document.getElementById('cameraStatus');
  const video = document.getElementById('cameraPreview');

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' },
      audio: false
    });

    video.srcObject = stream;
    status.textContent = 'Fotoaparát funguje!';
  } catch (error) {
    status.textContent = 'Chyba fotoaparátu: ' + error.message;
  }
}
</script>

</body>
  
</html>
