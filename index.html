<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>YOFI | Sklad</title>
  <link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="YOFI">
  
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

</head>
<body>
  <h1>YOFI</h1>
  <p>Mobilní skladová aplikace</p>
 
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js');
    });
  }
</script>
 

<button onclick="startScanner()">
  Skenovat EAN
</button>

<p id="scanResult">Zatím nic nenaskenováno</p>
  
<div id="productDetails">
  <h3>Informace o produktu</h3>
  
<p>
  <label for="productEAN">EAN produktu:</label>

<input type="text" id="productEAN"
       inputmode="numeric"
       placeholder="Naskenujte nebo zadejte EAN">

<button type="button" onclick="confirmEAN()">
  Potvrdit EAN
</button>

<script>
function confirmEAN() {
  const ean = document.getElementById("productEAN").value.trim();

  if (!ean) {
    alert("Nejprve zadejte nebo naskenujte EAN.");
    return;
  }

  document.getElementById("scanResult").textContent =
    "Zadaný EAN: " + ean;

  document.getElementById("productName").textContent =
    "Čeká na načtení produktu";

  document.getElementById("productStock").textContent = "—";
  document.getElementById("saveMovement").disabled = true;
}
</script>

</p>


  <p>Název: <strong id="productName">Zatím nenačteno</strong></p>
  <p>Skladem: <strong id="productStock">—</strong></p>

  <h3>Skladový pohyb</h3>

  <label for="movementType">Typ pohybu:</label>
  <select id="movementType">
    <option value="prijem">Příjem zboží</option>
    <option value="vydej">Výdej zboží</option>
  </select>

  <p>
    <label for="movementQuantity">Počet kusů:</label>
    <input type="number" id="movementQuantity"
           min="1" value="1">
  </p>

  <button id="saveMovement" disabled>
    Uložit skladový pohyb
  </button>
</div>

<div id="reader" style="width:100%;max-width:400px;"></div>

<script>
let scanner = null;

async function startScanner() {
  const result = document.getElementById("scanResult");
  result.textContent = "Spouštím fotoaparát...";

  try {
    if (scanner) {
      await scanner.stop();
      scanner.clear();
    }

    scanner = new Html5Qrcode("reader", {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.CODE_128
      ]
    });

    await scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 150 } },
      async (decodedText) => {
        result.textContent = "Naskenovaný EAN: " + decodedText;
        
document.getElementById("productEAN").value = decodedText;
document.getElementById("productName").textContent = "Čeká na načtení produktu";
document.getElementById("productStock").textContent = "—";
document.getElementById("saveMovement").disabled = true;

        await scanner.stop();
        scanner.clear();
        scanner = null;
      },
      () => {}
    );
  } catch (error) {
    result.textContent = "Chyba: " + error.message;
  }
}
</script>


</body>
  
</html>
